[tool.poetry]
name = "image-evaluator"
version = "0.6.1"
description = "An automatic image evaluation script"
authors = ["neverbiasu"]
license = "MIT"
readme = "README.md"
packages = [{include = "image_evaluator"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
clip-score = "*"
insightface = "*"
onnxruntime = { version = "*", markers = "sys_platform == 'darwin' or sys_platform == 'linux'" }
open-clip-torch = "*"
torch = ">=1.7.0"
transformers = "*"
pillow = "*"
numpy = "*"
tqdm = "*"
lpips = "*"
scikit-image = "*"
clean-fid = "==0.1.35"
accelerate = { version = ">=0.26.0", optional = true }
sentencepiece = { version = ">=0.1.99", optional = true }
timm = { version = ">=0.9.0", optional = true }

[tool.poetry.extras]
vqa = ["accelerate", "sentencepiece"]
preference = ["timm"]
modern = ["accelerate", "sentencepiece", "timm"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"
ruff = "^0.9.0"

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
image-evaluator = "image_evaluator.main:cli"
